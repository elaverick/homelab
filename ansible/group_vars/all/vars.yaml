---
# Trusted homelab network
homelab_ipv4_network: "192.168.50.0/24"

# Host services
ssh_port: 22
external_ldap_port: 389
external_ldaps_port: 636
internal_ldap_port: 1389
internal_ldaps_port: 1636

# Podman service account
podman_user: app-runner
podman_subuid_start: 100000
podman_subuid_count: 65536
podman_subgid_start: 100000
podman_subgid_count: 65536

# Administration account
admin_user: elaverick

# SSH public key for the administration account
admin_authorized_key: >-
  ssh-ed25519
  AAAAC3NzaC1lZDI1NTE5AAAAIDIq2Y4iuLioCuGWdLqOCPtdDKMF8xUCAnnvPQ1q+7YU
  eddsa-key-20260807

# Domain configuration
domain: "laverick"
domain_suffix: "home.arpa"

# Certificate Server Host Port
intermediate_ca_host_port: 9000

# Podwatch NGINX TLS termination port (loopback only)
podwatch_tls_port: 8490

# cert-enrolment (join.<domain>) NGINX TLS termination port (loopback only)
cert_enrolment_tls_port: 8491

# Certificates supplied by the offline Root CA
source_certs_path: "{{ playbook_dir }}/../certs"

root_certificate: "rootCA.crt"
intermediate_ca_certificate: "intermediateCA.crt"
intermediate_ca_private_key: "intermediateCA.key"

# NGINX ACME configuration
acme_webroot: "/var/lib/homelab/acme"

# LDAP Container configuration

ldap_container_name: "ldap-server"

ldap_ports:
  - "127.0.0.1:{{ internal_ldap_port }}:{{ external_ldap_port }}"
  - "127.0.0.1:{{ internal_ldaps_port }}:{{ external_ldaps_port }}"

ldap_domain: "{{ domain }}.{{ domain_suffix }}"
ldap_organisation: "Laverick Home Lab"

# LDAP connection

ldap_host: "127.0.0.1"

ldap_uri: "ldap://{{ ldap_host }}:{{ external_ldap_port }}"

# LDAP directory

domain_fqdn: "{{ domain }}.{{ domain_suffix }}"
# Maps an LDAP deviceZone value to the VLAN FreeRADIUS returns to the access
# point. A device whose zone is not listed here is rejected, and
# cert-enrolment offers exactly these zones at registration.
#
# VLAN IDs are placeholders until the VLAN plan is agreed with the
# firewall design.
freeradius_zone_vlans:
  trusted: 20
  quarantine: 30

# Wi-Fi networks (SSIDs), by role:
# - trusted: WPA3-Enterprise, EAP-TLS; FreeRADIUS assigns the VLAN
# - onboarding: open captive-portal network for enrolling new devices
# - iot: WPA2/WPA3-Personal for devices that cannot do 802.1X
wifi_trusted_ssid: "Laverick"
wifi_onboarding_ssid: "Laverick-Setup"
wifi_iot_ssid: "Laverick-IoT"

# step-ca JWK provisioner for device certificates. step-ca holds its public
# key; cert-enrolment holds the private key (cert_enrolment_provisioner_jwk
# in the vault) and signs single-use enrolment tokens with it.
device_provisioner_name: "cert-enrolment"

# Device identities: certificate Common Name and LDAP deviceId are
# <name>.{{ device_domain }}. Never published in DNS.
device_domain: "device.{{ domain_fqdn }}"

ldap_base_dn: "{{ domain_fqdn.split('.') | map('regex_replace', '^(.*)$', 'dc=\\1') | join(',') }}"
ldap_admin_dn: "cn=admin,{{ ldap_base_dn }}"
freeradius_ldap_server: "ldaps://ldap.{{ domain_fqdn }}:636"

# LDAP service accounts

freeradius_bind_dn: "cn=freeradius,ou=ServiceAccounts,{{ ldap_base_dn }}"
cert_enrolment_bind_dn: "cn=cert-enrolment,ou=ServiceAccounts,{{ ldap_base_dn }}"

# User/group configuration

uidNumber: 10000

ldapGroups:
  - name: users
    gidNumber: 10000

  - name: admins
    gidNumber: 10001

  # May register devices and download enrollment material.
  # Every provisioned user is a member.
  - name: device-enrollers
    gidNumber: 10002
    includeProvisionedUsers: true

ldapUsers:
  - uid: elaverick
    firstname: Edward
    surname: Laverick
    gidNumber: 10000

  - uid: tlaverick
    firstname: Tom
    surname: Laverick
    gidNumber: 10000