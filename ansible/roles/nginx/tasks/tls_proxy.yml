---

# Terminates TLS in NGINX for a backend that only speaks plain HTTP.
#
# The certificate must already have been issued (certificate role,
# host deployment mode) because NGINX refuses to load a configuration
# that references missing certificate files. Port 443 is owned by the
# stream SNI router, so this server listens on loopback and needs a
# matching nginx_https_proxies entry.

- name: Validate NGINX TLS proxy configuration
  ansible.builtin.assert:
    that:
      - nginx_tls_proxy_name | length > 0
      - nginx_tls_proxy_certificate_name in certificates
      - nginx_tls_proxy_listen_port | string | length > 0
      - nginx_tls_proxy_backend_port | string | length > 0
    fail_msg: >-
      nginx_tls_proxy_name, nginx_tls_proxy_certificate_name,
      nginx_tls_proxy_listen_port and nginx_tls_proxy_backend_port
      are required, and the certificate must be in the central
      certificates list.

- name: Configure NGINX TLS proxy for {{ nginx_tls_proxy_name }}
  ansible.builtin.template:
    src: tls-proxy.conf.j2
    dest: "{{ nginx_http_config_path }}/tls-{{ nginx_tls_proxy_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  notify: Reload NGINX

- name: Deploy NGINX certificate reload service
  ansible.builtin.template:
    src: nginx-certificate-reload.service.j2
    dest: /etc/systemd/system/nginx-certificate-reload.service
    owner: root
    group: root
    mode: "0644"
  register: nginx_certificate_reload_service

- name: Deploy NGINX certificate watch for {{ nginx_tls_proxy_certificate_name }}
  ansible.builtin.template:
    src: nginx-certificate.path.j2
    dest: "/etc/systemd/system/nginx-certificate-{{ nginx_tls_proxy_certificate_name }}.path"
    owner: root
    group: root
    mode: "0644"
  register: nginx_certificate_path

- name: Reload systemd manager
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: nginx_certificate_reload_service.changed or nginx_certificate_path.changed

- name: Enable and start NGINX certificate watch for {{ nginx_tls_proxy_certificate_name }}
  ansible.builtin.systemd_service:
    name: "nginx-certificate-{{ nginx_tls_proxy_certificate_name }}.path"
    enabled: true
    state: "{{ 'restarted' if nginx_certificate_path.changed else 'started' }}"

- name: Apply NGINX TLS proxy changes
  ansible.builtin.meta: flush_handlers
