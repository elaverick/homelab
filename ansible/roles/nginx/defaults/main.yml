---
# NGINX packages
nginx_packages:
  - nginx
  - libnginx-mod-stream

# NGINX configuration
nginx_config_path: /etc/nginx/nginx.conf

# NGINX stream configuration
nginx_stream_config_path: /etc/nginx/stream.conf.d

# NGINX HTTP configuration
nginx_http_config_path: /etc/nginx/conf.d

# ACME HTTP-01 challenge webroot
nginx_acme_challenge_path: "{{ acme_webroot }}/.well-known/acme-challenge"

# HTTP proxy definitions
nginx_http_proxies: []

# HTTPS/TLS passthrough proxies
nginx_https_proxies:
  - name: ca
    server_name: "ca.{{ domain_fqdn }}"
    backend_host: 127.0.0.1
    backend_port: "{{ intermediate_ca_host_port }}"

  - name: pihole
    server_name: "pihole.{{ domain_fqdn }}"
    backend_host: 127.0.0.1
    backend_port: 8443

  # Terminated by the NGINX TLS proxy configured by the podwatch role
  - name: podwatch
    server_name: "{{ ansible_hostname }}.{{ domain_fqdn }}"
    backend_host: 127.0.0.1
    backend_port: "{{ podwatch_tls_port }}"

# TLS-terminating proxy, configured by consumer roles via tls_proxy.yml
# once their certificate has been issued.
nginx_tls_proxy_name: ""
nginx_tls_proxy_certificate_name: ""
nginx_tls_proxy_listen_port: ""
nginx_tls_proxy_backend_scheme: "http"
nginx_tls_proxy_backend_host: 127.0.0.1
nginx_tls_proxy_backend_port: ""

# TCP proxy definitions
nginx_tcp_proxies:
  - name: ldap
    listen_port: "{{ external_ldap_port }}"
    backend_host: 127.0.0.1
    backend_port: "{{ internal_ldap_port }}"

  - name: ldaps
    listen_port: "{{ external_ldaps_port }}"
    backend_host: 127.0.0.1
    backend_port: "{{ internal_ldaps_port }}"

  - name: pihole-dns-tcp
    listen_port: 53
    backend_host: 127.0.0.1
    backend_port: 1053

# UDP proxy definitions
nginx_udp_proxies:
  - name: pihole-dns
    listen_port: 53
    backend_host: 127.0.0.1
    backend_port: 1053

# Ports exposed by NGINX through the host firewall
nginx_firewall_tcp_ports:
  - 53
  - 80
  - 443
  - "{{ external_ldap_port }}"
  - "{{ external_ldaps_port }}"

nginx_firewall_udp_ports:
  - 53