---

# Container
intermediate_ca_container_name: "intermediate-ca"
intermediate_ca_image: "docker.io/smallstep/step-ca:0.30.2"

# Podman persistent storage
intermediate_ca_data_volume: "intermediate_ca_data"

# ACME HTTP-01 challenge webroot
intermediate_ca_acme_webroot: "/var/lib/homelab/acme"

# step-ca
intermediate_ca_address: ":9000"
intermediate_ca_dns_name: "ca.{{ domain_fqdn }}"

# CA filesystem inside the Podman volume
intermediate_ca_home: "/home/step"
intermediate_ca_config_dir: "{{ intermediate_ca_home }}/config"
intermediate_ca_certs_dir: "{{ intermediate_ca_home }}/certs"
intermediate_ca_secrets_dir: "{{ intermediate_ca_home }}/secrets"
intermediate_ca_db_path: "{{ intermediate_ca_home }}/db"

# Database
intermediate_ca_db_type: "badgerV2"
intermediate_ca_db_file_loading_mode: "FileIO"

# step-ca container user
#
# The official image runs as UID/GID 1000 ("step").
intermediate_ca_uid: 1000
intermediate_ca_gid: 1000

# Host networking
intermediate_ca_container_port: 9000

# Quadlet
intermediate_ca_quadlet_filename: "intermediate-ca.container"

# Certificate Validity
intermediate_ca_acme_min_tls_cert_duration: "5m"
intermediate_ca_acme_max_tls_cert_duration: "720h"
intermediate_ca_acme_default_tls_cert_duration: "720h"

# Device certificates, issued through the JWK provisioner whose private key
# the cert-enrolment RA holds (cert_enrolment_provisioner_jwk in the vault).
# Only the public key is written to ca.json. step-ca's own renewal is
# disabled for this provisioner: devices renew through the RA, which checks
# LDAP and records every certificate so it can revoke them.
intermediate_ca_device_template: "{{ intermediate_ca_home }}/templates/device-client.tpl"
intermediate_ca_device_min_cert_duration: "5m"
intermediate_ca_device_max_cert_duration: "720h"
intermediate_ca_device_default_cert_duration: "720h"