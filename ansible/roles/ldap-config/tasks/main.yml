---
- name: Check LDAP server is reachable
  ansible.builtin.wait_for:
    host: "{{ ldap_host }}"
    port: "{{ external_ldap_port }}"
    timeout: 30

- name: Check whether managedDevice schema is installed
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_exec:
    name: "{{ ldap_container_name }}"
    command: >-
      ldapsearch
      -Q
      -Y EXTERNAL
      -H ldapi:///
      -b "cn=schema,cn=config"
      -s one
      -LLL
      "(olcObjectClasses=*1.3.6.1.4.1.66636.1.1.1.1*)"
      dn
  register: managed_device_schema
  changed_when: false
  failed_when: managed_device_schema.rc != 0

- name: Copy managedDevice schema LDIF to host
  become: true
  ansible.builtin.copy:
    src: managedDevice.ldif
    dest: /tmp/managedDevice.ldif
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0600"
  when: managed_device_schema.stdout | trim == ""

- name: Copy managedDevice schema LDIF to container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_copy:
    container: "{{ ldap_container_name }}"
    src: /tmp/managedDevice.ldif
    dest: /tmp/managedDevice.ldif
  when: managed_device_schema.stdout | trim == ""

- name: Import managedDevice schema
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_exec:
    name: "{{ ldap_container_name }}"
    command: >-
      ldapadd
      -Q
      -Y EXTERNAL
      -H ldapi:///
      -f /tmp/managedDevice.ldif
  register: managed_device_schema_import
  when: managed_device_schema.stdout | trim == ""

- name: Remove managedDevice schema LDIF from container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_exec:
    name: "{{ ldap_container_name }}"
    command: rm -f /tmp/managedDevice.ldif
  when: managed_device_schema.stdout | trim == ""

- name: Remove managedDevice schema LDIF from host
  become: true
  ansible.builtin.file:
    path: /tmp/managedDevice.ldif
    state: absent
  when: managed_device_schema.stdout | trim == ""

# Directories created before deviceCertificate existed get it added in
# place: the attribute, and the object class extended to allow it.
- name: Read managedDevice schema entry
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_exec:
    name: "{{ ldap_container_name }}"
    command: >-
      ldapsearch
      -Q
      -Y EXTERNAL
      -H ldapi:///
      -o ldif-wrap=no
      -b "cn=schema,cn=config"
      -s one
      -LLL
      "(olcObjectClasses=*1.3.6.1.4.1.66636.1.1.1.1*)"
      olcAttributeTypes
  register: managed_device_schema_entry
  changed_when: false

- name: Check whether managedDevice schema needs upgrading
  ansible.builtin.set_fact:
    ldap_config_managed_device_schema_dn: >-
      {{ managed_device_schema_entry.stdout_lines | select('match', '^dn: ') | first | regex_replace('^dn: ', '') }}
    ldap_config_managed_device_schema_upgrade: >-
      {{ '1.3.6.1.4.1.66636.1.1.2.5' not in managed_device_schema_entry.stdout }}

- name: Upgrade managedDevice schema
  when: ldap_config_managed_device_schema_upgrade | bool
  block:
    - name: Copy managedDevice schema upgrade LDIF to host
      become: true
      ansible.builtin.template:
        src: managedDevice-upgrade.ldif.j2
        dest: /tmp/managedDevice-upgrade.ldif
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        mode: "0600"

    - name: Copy managedDevice schema upgrade LDIF to container
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_copy:
        container: "{{ ldap_container_name }}"
        src: /tmp/managedDevice-upgrade.ldif
        dest: /tmp/managedDevice-upgrade.ldif

    - name: Apply managedDevice schema upgrade
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_exec:
        name: "{{ ldap_container_name }}"
        command: >-
          ldapmodify
          -Q
          -Y EXTERNAL
          -H ldapi:///
          -f /tmp/managedDevice-upgrade.ldif

  always:
    - name: Remove managedDevice schema upgrade LDIF from container
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_exec:
        name: "{{ ldap_container_name }}"
        command: rm -f /tmp/managedDevice-upgrade.ldif

    - name: Remove managedDevice schema upgrade LDIF from host
      become: true
      ansible.builtin.file:
        path: /tmp/managedDevice-upgrade.ldif
        state: absent

- name: Manage LDAP directory objects
  no_log: true
  vars:
    ldap_auth:
      server_uri: "{{ ldap_uri }}"
      bind_dn: "{{ ldap_admin_dn }}"
      bind_pw: "{{ ldap_password }}"
  block:
    - name: Create base OUs
      community.general.ldap_entry:
        dn: "ou={{ item }},{{ ldap_base_dn }}"
        objectClass: [organizationalUnit]
        state: present
      args: "{{ ldap_auth }}"
      loop: [People, Devices, ServiceAccounts, Groups]
      loop_control:
        label: "{{ item }}"

    - name: Create Groups
      community.general.ldap_entry:
        dn: "cn={{ item.name }},ou=Groups,{{ ldap_base_dn }}"
        objectClass:
          - posixGroup
        attributes:
          cn: "{{ item.name }}"
          gidNumber: "{{ item.gidNumber | int }}"
        state: present
      args: "{{ ldap_auth }}"
      loop: "{{ ldapGroups }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check whether LDAP users have already been created
      community.general.ldap_search:
        dn: "{{ ldap_base_dn }}"
        filter: "(uid={{ ldapUsers[0].uid }})"
        scope: subordinate
        attrs:
          - uid
      args: "{{ ldap_auth }}"
      register: ldap_users_check

    - name: Set LDAP users creation state
      ansible.builtin.set_fact:
        ldap_users_created: "{{ ldap_users_check.results | length > 0 }}"

    - name: Prompt for LDAP user passwords
      ansible.builtin.pause:
        prompt: "Enter initial password for {{ item.uid }}"
        echo: false
      loop: "{{ ldapUsers }}"
      loop_control:
        label: "{{ item.uid }}"
      register: ldap_password_prompts
      when: not ldap_users_created

    - name: Verify prompted passwords are different
      ansible.builtin.assert:
        that:
          - ldap_password_prompts.results | map(attribute='user_input') | list | unique | length ==
            ldap_password_prompts.results | length
        fail_msg: "ERROR: LDAP user passwords must be different!"
        success_msg: "LDAP user passwords are different."
      when: not ldap_users_created

    - name: Create LDAP users with prompted passwords
      community.general.ldap_entry:
        dn: "uid={{ item.0.uid }},ou=People,{{ ldap_base_dn }}"
        objectClass:
          - inetOrgPerson
          - posixAccount
          - shadowAccount
        attributes:
          uid: "{{ item.0.uid }}"
          sn: "{{ item.0.surname }}"
          givenName: "{{ item.0.firstname }}"
          cn: "{{ item.0.firstname }} {{ item.0.surname }}"
          uidNumber: "{{ (uidNumber | int) + index }}"
          gidNumber: "{{ item.0.gidNumber | int }}"
          userPassword: "{{ item.1.user_input }}"
          pwdReset: "TRUE"
          gecos: "{{ item.0.firstname }} {{ item.0.surname }}"
          loginShell: "/bin/bash"
          homeDirectory: "/home/{{ item.0.uid }}"
        state: present
      args: "{{ ldap_auth }}"
      loop: "{{ ldapUsers | zip(ldap_password_prompts.results) | list }}"
      loop_control:
        index_var: index
        label: "{{ item.0.uid }}"
      when: not ldap_users_created

    - name: Add provisioned users to groups that include them
      community.general.ldap_attrs:
        dn: "cn={{ item.name }},ou=Groups,{{ ldap_base_dn }}"
        attributes:
          memberUid: "{{ ldapUsers | map(attribute='uid') | list }}"
        state: present
      args: "{{ ldap_auth }}"
      loop: "{{ ldapGroups | selectattr('includeProvisionedUsers', 'defined') | selectattr('includeProvisionedUsers') | list }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Create FreeRADIUS service account
      community.general.ldap_entry:
        dn: "{{ freeradius_bind_dn }}"
        objectClass:
          - simpleSecurityObject
          - organizationalRole
        attributes:
          cn: "freeradius"
          description: "FreeRADIUS LDAP bind account"
          userPassword: "{{ freeradius_bind_password }}"
        state: present
      args: "{{ ldap_auth }}"

    - name: Create cert-enrolment service account
      community.general.ldap_entry:
        dn: "{{ cert_enrolment_bind_dn }}"
        objectClass:
          - simpleSecurityObject
          - organizationalRole
        attributes:
          cn: "cert-enrolment"
          description: "cert-enrolment LDAP bind account"
          userPassword: "{{ cert_enrolment_bind_password }}"
        state: present
      args: "{{ ldap_auth }}"

# Access rules are compared with the deployed set as slapd stores them, and
# replaced as a whole when they differ, so their order is always exact.
- name: Read LDAP access rules
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_exec:
    name: "{{ ldap_container_name }}"
    command: >-
      ldapsearch
      -Q
      -Y EXTERNAL
      -H ldapi:///
      -o ldif-wrap=no
      -LLL
      -s base
      -b "{{ ldap_config_database_dn }}"
      olcAccess
  register: ldap_access_rules_read
  changed_when: false

- name: Compare LDAP access rules
  ansible.builtin.set_fact:
    ldap_access_rules_deployed: >-
      {{ ldap_access_rules_read.stdout_lines
         | select('match', '^olcAccess: ')
         | map('regex_replace', '^olcAccess: \{[0-9]+\}', '')
         | list }}

- name: Replace LDAP access rules
  when: ldap_access_rules_deployed != ldap_config_access_rules
  block:
    - name: Copy LDAP access rules LDIF to host
      become: true
      ansible.builtin.template:
        src: access.ldif.j2
        dest: /tmp/access.ldif
        owner: "{{ podman_user }}"
        group: "{{ podman_user }}"
        mode: "0600"

    - name: Copy LDAP access rules LDIF to container
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_copy:
        container: "{{ ldap_container_name }}"
        src: /tmp/access.ldif
        dest: /tmp/access.ldif

    - name: Apply LDAP access rules
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_exec:
        name: "{{ ldap_container_name }}"
        command: >-
          ldapmodify
          -Q
          -Y EXTERNAL
          -H ldapi:///
          -f /tmp/access.ldif

  always:
    - name: Remove LDAP access rules LDIF from container
      become: true
      become_user: "{{ podman_user }}"
      containers.podman.podman_container_exec:
        name: "{{ ldap_container_name }}"
        command: rm -f /tmp/access.ldif

    - name: Remove LDAP access rules LDIF from host
      become: true
      ansible.builtin.file:
        path: /tmp/access.ldif
        state: absent
