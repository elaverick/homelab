---
- name: Pull LDAP container image
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_image:
    name: "{{ ldap_image }}"
    state: present

- name: Create LDAP admin password secret
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_secret:
    name: "{{ ldap_secret_name }}"
    data: "{{ ldap_password }}"
    state: present
  no_log: true

- name: Create LDAP data volume
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_volume:
    name: "{{ ldap_data_volume }}"
    state: present

- name: Create LDAP configuration volume
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_volume:
    name: "{{ ldap_config_volume }}"
    state: present

- name: Create LDAP TLS volume
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_volume:
    name: "{{ ldap_tls_volume }}"
    state: present

- name: Create LDAP Quadlet
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: "{{ ldap_container_name }}"
    image: "{{ ldap_image }}"
    state: quadlet
    quadlet_filename: "{{ ldap_quadlet_filename }}"
    quadlet_file_mode: "0640"
    publish: "{{ ldap_ports }}"
    env:
      LDAP_DOMAIN: "{{ ldap_domain }}"
      LDAP_ORGANISATION: "{{ ldap_organisation }}"
    add_hosts: "{{ dict([('ldap.' ~ domain_fqdn, 'host-gateway')]) }}"
    secrets:
      - "{{ ldap_secret_name }},type=mount,target=ldap_admin_password"
    volumes:
      - "{{ ldap_data_volume }}:/var/lib/ldap"
      - "{{ ldap_config_volume }}:/etc/ldap/slapd.d"
      - "{{ ldap_tls_volume }}:{{ ldap_tls_directory }}"
    quadlet_options:
      - "AutoUpdate=registry"
      - |
        [Install]
        WantedBy=default.target
  register: ldap_quadlet

- name: Reload user systemd manager
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user

- name: Enable and start LDAP container
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    name: "{{ ldap_container_name }}.service"
    enabled: true
    state: started
    scope: user

- name: Restart LDAP after Quadlet change
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    name: "{{ ldap_container_name }}.service"
    state: restarted
    scope: user
  when: ldap_quadlet.changed

- name: Configure LDAP certificate
  ansible.builtin.include_role:
    name: certificate
  vars:
    certificate_name: "ldap"
    certificate_deployment_mode: "split"
    certificate_deployment_target: "{{ ldap_container_name }}"
    certificate_deploy_certificate_path: "{{ ldap_tls_certificate }}"
    certificate_deploy_key_path: "{{ ldap_tls_key }}"
    certificate_restart_consumer_on_issue: false

- name: Configure LDAP TLS
  ansible.builtin.import_tasks:
    file: tls.yml

- name: Restart LDAP after TLS configuration
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    name: "{{ ldap_container_name }}.service"
    state: restarted
    scope: user
  when: ldap_tls_modify.changed