---

- name: Issue cert-enrolment certificate
  ansible.builtin.include_role:
    name: certificate
  vars:
    certificate_name: "{{ cert_enrolment_certificate_name }}"
    certificate_deployment_mode: "host"

- name: Expose cert-enrolment through NGINX
  ansible.builtin.include_role:
    name: nginx
    tasks_from: tls_proxy.yml
  vars:
    nginx_tls_proxy_name: "{{ cert_enrolment_container_name }}"
    nginx_tls_proxy_certificate_name: "{{ cert_enrolment_certificate_name }}"
    nginx_tls_proxy_listen_port: "{{ cert_enrolment_tls_port }}"
    nginx_tls_proxy_backend_port: "{{ cert_enrolment_host_port }}"
