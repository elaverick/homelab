---

# Portal: join.<domain> ---------------------------------------------------------

- name: Issue cert-enrolment portal certificate
  ansible.builtin.include_role:
    name: certificate
  vars:
    certificate_name: "{{ cert_enrolment_certificate_name }}"
    certificate_deployment_mode: "host"

- name: Expose cert-enrolment portal through NGINX
  ansible.builtin.include_role:
    name: nginx
    tasks_from: tls_proxy.yml
  vars:
    nginx_tls_proxy_name: "{{ cert_enrolment_container_name }}"
    nginx_tls_proxy_certificate_name: "{{ cert_enrolment_certificate_name }}"
    nginx_tls_proxy_listen_port: "{{ cert_enrolment_tls_port }}"
    nginx_tls_proxy_backend_port: "{{ cert_enrolment_host_port }}"

# RA: ra.<domain>, with device client certificates ---------------------------

- name: Issue cert-enrolment RA certificate
  ansible.builtin.include_role:
    name: certificate
  vars:
    certificate_name: "{{ cert_enrolment_ra_certificate_name }}"
    certificate_deployment_mode: "host"

# Devices send only their own certificate, so NGINX needs the Intermediate CA
# as well as the Root CA to verify it.
- name: Install CA chain for verifying device certificates
  become: true
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', source_certs_path ~ '/' ~ intermediate_ca_certificate) }}
      {{ lookup('ansible.builtin.file', source_certs_path ~ '/' ~ root_certificate) }}
    dest: "{{ cert_enrolment_client_ca_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload NGINX

- name: Expose cert-enrolment RA through NGINX
  ansible.builtin.include_role:
    name: nginx
    tasks_from: tls_proxy.yml
  vars:
    nginx_tls_proxy_name: "{{ cert_enrolment_ra_container_name }}"
    nginx_tls_proxy_certificate_name: "{{ cert_enrolment_ra_certificate_name }}"
    nginx_tls_proxy_listen_port: "{{ cert_enrolment_ra_tls_port }}"
    nginx_tls_proxy_backend_port: "{{ cert_enrolment_ra_host_port }}"
    nginx_tls_proxy_client_ca: "{{ cert_enrolment_client_ca_path }}"
