---
# One image, two roles: the portal (web pages at join.<domain>) and the
# registration authority (RA, at ra.<domain>). Both run from the same image
# on a private network; the portal calls the RA by container name.
cert_enrolment_image: "ghcr.io/elaverick/cert-enrolment:latest"
cert_enrolment_network: "cert-enrolment"

# Portal
cert_enrolment_container_name: "cert-enrolment"
cert_enrolment_quadlet_filename: "{{ cert_enrolment_container_name }}.container"
cert_enrolment_host_port: 8095
cert_enrolment_certificate_name: "join"

# RA
cert_enrolment_ra_container_name: "cert-enrolment-ra"
cert_enrolment_ra_quadlet_filename: "{{ cert_enrolment_ra_container_name }}.container"
cert_enrolment_ra_host_port: 8096
cert_enrolment_ra_certificate_name: "ra"

# Both roles listen here inside their containers; plain HTTP, published on
# loopback only. NGINX terminates TLS.
cert_enrolment_container_port: 8080

# The portal also listens here for plain HTTP, which NGINX serves on
# http://join.<domain>/ as the onboarding network's captive portal, for
# devices that do not trust the Root CA yet. It has its own sessions and
# cookies. Published on loopback at cert_enrolment_onboarding_host_port.
cert_enrolment_onboarding_container_port: 8081

# How the portal reaches the RA, and how devices reach it.
cert_enrolment_ra_internal_url: "http://{{ cert_enrolment_ra_container_name }}:{{ cert_enrolment_container_port }}"
cert_enrolment_ra_public_url: "https://{{ cert_enrolment_ra_certificate_name }}.{{ domain_fqdn }}"

# Secrets, mounted into the containers as files. Only the RA holds the LDAP
# service account and the step-ca provisioner key; both hold the API key the
# portal uses to call the RA.
cert_enrolment_secret_name: "cert_enrolment_bind_password"
cert_enrolment_provisioner_secret_name: "cert_enrolment_provisioner_jwk"
cert_enrolment_api_key_secret_name: "cert_enrolment_ra_api_key"
cert_enrolment_secret_dir: "/run/secrets"

# step-ca, as the RA reaches it
cert_enrolment_ca_url: "https://ca.{{ domain_fqdn }}"

# Wi-Fi profile written by the enrolment scripts. Devices validate the
# RADIUS server certificate against this name.
cert_enrolment_wifi_ssid: "{{ wifi_trusted_ssid }}"
cert_enrolment_radius_server_name: "freeradius.{{ domain_fqdn }}"

# The container image runs as this unprivileged user
cert_enrolment_uid: 65532

# The Root CA installed on the host by base_host is the only CA the
# services trust for LDAPS and step-ca, and the one given to devices.
cert_enrolment_host_root_ca: "/usr/local/share/ca-certificates/{{ root_certificate }}"
cert_enrolment_container_root_ca: "/etc/cert-enrolment/root-ca.crt"

# Root and Intermediate CA, against which NGINX verifies the certificates
# devices present to the RA when renewing.
cert_enrolment_client_ca_path: "/etc/nginx/cert-enrolment-client-ca.pem"

cert_enrolment_ldap_url: "ldaps://ldap.{{ domain_fqdn }}:{{ external_ldaps_port }}"
cert_enrolment_people_dn: "ou=People,{{ ldap_base_dn }}"
cert_enrolment_enrollers_group_dn: "cn=device-enrollers,ou=Groups,{{ ldap_base_dn }}"
cert_enrolment_devices_dn: "ou=Devices,{{ ldap_base_dn }}"

# Offered at registration, first is the default. Taken from the FreeRADIUS
# zone map so that every zone a device can be given has a VLAN.
cert_enrolment_device_zones: "{{ freeradius_zone_vlans.keys() | list }}"
