---
- name: Pull FreeRADIUS container image
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_image:
    name: "{{ freeradius_image }}"
    state: present

- name: Create FreeRADIUS configuration volume
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_volume:
    name: "{{ freeradius_config_volume }}"
    state: present
  register: freeradius_config_volume_info

- name: Record FreeRADIUS configuration volume mount point
  ansible.builtin.set_fact:
    freeradius_config_volume_mountpoint: "{{ freeradius_config_volume_info.volume.Mountpoint }}"

- name: Create FreeRADIUS trust volume
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_volume:
    name: "{{ freeradius_trust_volume }}"
    state: present
  register: freeradius_trust_volume_info

- name: Record FreeRADIUS trust volume mount point
  ansible.builtin.set_fact:
    freeradius_trust_volume_mountpoint: "{{ freeradius_trust_volume_info.volume.Mountpoint }}"

- name: Install Root CA certificate
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.copy:
    src: "{{ source_certs_path }}/{{ root_certificate }}"
    dest: "{{ freeradius_trust_volume_mountpoint }}/{{ root_certificate }}"
    mode: "0644"
  register: freeradius_trust_certificate

- name: Install device certificate CA chain
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.copy:
    content: |
      {{ lookup('ansible.builtin.file', source_certs_path ~ '/' ~ intermediate_ca_certificate) }}
      {{ lookup('ansible.builtin.file', source_certs_path ~ '/' ~ root_certificate) }}
    dest: "{{ freeradius_trust_volume_mountpoint }}/{{ freeradius_client_ca_filename }}"
    mode: "0644"
  register: freeradius_client_ca

# The certificate role deploys using podman cp, which requires a container
# as its destination. During initial deployment FreeRADIUS cannot itself
# provide that destination because its EAP configuration requires the
# certificate before the container can start.
#
# A temporary container using the same image provides the deployment target.
# It mounts only the persistent trust volume.

- name: Check whether FreeRADIUS container exists
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container_info:
    name:
      - "{{ freeradius_container_name }}"
  register: freeradius_container_info

- name: Create temporary FreeRADIUS certificate deployment container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: "{{ freeradius_container_name }}"
    image: "{{ freeradius_image }}"
    state: started
    command:
      - sleep
      - infinity
    volumes:
      - "{{ freeradius_trust_volume }}:{{ freeradius_trust_directory }}"
  when: freeradius_container_info.containers | length == 0
  register: freeradius_certificate_bootstrap_container

- name: Configure FreeRADIUS certificate
  ansible.builtin.include_role:
    name: certificate
  vars:
    certificate_name: "freeradius"
    certificate_deployment_mode: "bundle"
    certificate_deployment_target: "{{ freeradius_container_name }}"
    certificate_deploy_path: "{{ freeradius_certificate_path }}"
    certificate_restart_consumer_on_issue: false
    certificate_deploy_owner: "root"
    certificate_deploy_group: "freerad"
    certificate_deploy_mode: "0640"

- name: Remove temporary FreeRADIUS certificate deployment container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: "{{ freeradius_container_name }}"
    state: absent
  when:
    - freeradius_certificate_bootstrap_container is defined
    - freeradius_certificate_bootstrap_container.changed

# A named volume initially mounted over a directory containing files in the
# image is populated by Podman's native volume copy-up behaviour.
#
# Mounting the configuration volume directly at /etc/freeradius allows
# Podman to initialise it from the image while retaining the image's
# configuration layout and ownership.

- name: Create temporary FreeRADIUS configuration bootstrap container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: freeradius-config-bootstrap
    image: "{{ freeradius_image }}"
    state: started
    command:
      - sleep
      - infinity
    volumes:
      - "{{ freeradius_config_volume }}:{{ freeradius_config_directory }}"
  when: freeradius_config_volume_info.changed
  register: freeradius_config_bootstrap_container

- name: Remove temporary FreeRADIUS configuration bootstrap container
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: freeradius-config-bootstrap
    state: absent
  when:
    - freeradius_config_bootstrap_container is defined
    - freeradius_config_bootstrap_container.changed

- name: Deploy FreeRADIUS LDAP module configuration
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: ldap.j2
    dest: "{{ freeradius_config_volume_mountpoint }}{{ freeradius_ldap_module_config }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0640"
  register: freeradius_ldap_config
  no_log: false

- name: Deploy FreeRADIUS EAP module configuration
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.template:
    src: eap.j2
    dest: "{{ freeradius_config_volume_mountpoint }}{{ freeradius_eap_module_config }}"
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: "0640"
  register: freeradius_eap_config

- name: Enable FreeRADIUS LDAP module
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.file:
    src: "../mods-available/ldap"
    dest: "{{ freeradius_config_volume_mountpoint }}{{ freeradius_ldap_module_enabled }}"
    state: link
    force: true
  register: freeradius_ldap_module

- name: Validate FreeRADIUS clients
  ansible.builtin.assert:
    that:
      - item.name is match('^[A-Za-z0-9_-]+$')
      - item.ipaddr | length > 0
      - item.secret | length >= 16
    fail_msg: >-
      Each RADIUS client needs a name, an ipaddr and a secret of at least
      16 characters.
    quiet: true
  loop: "{{ freeradius_clients }}"
  loop_control:
    label: "{{ item.name | default('unnamed') }}"
  no_log: true

# The image owns /etc/freeradius, sites-available and sites-enabled by
# freerad, which maps to a subordinate UID on the host. Files there are
# managed from inside the rootless user namespace, where root can write.
- name: Deploy FreeRADIUS clients configuration
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.template:
    src: clients.j2
    dest: "{{ freeradius_config_volume_mountpoint }}{{ freeradius_clients_config }}"
    owner: "0"
    group: "{{ freeradius_gid }}"
    mode: "0640"
  register: freeradius_clients_file
  no_log: true

- name: Deploy FreeRADIUS virtual servers
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.template:
    src: "{{ item.template }}"
    dest: "{{ freeradius_config_volume_mountpoint }}/sites-available/{{ item.name }}"
    owner: "0"
    group: "{{ freeradius_gid }}"
    mode: "0640"
  loop:
    - name: "{{ freeradius_site_name }}"
      template: site-wifi.j2
    - name: "{{ freeradius_device_site_name }}"
      template: site-device-authorisation.j2
  loop_control:
    label: "{{ item.name }}"
  register: freeradius_sites

- name: Enable FreeRADIUS virtual servers
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    src: "../sites-available/{{ item }}"
    dest: "{{ freeradius_config_volume_mountpoint }}/sites-enabled/{{ item }}"
    state: link
    force: true
  loop:
    - "{{ freeradius_site_name }}"
    - "{{ freeradius_device_site_name }}"
  register: freeradius_sites_enabled

- name: Disable stock FreeRADIUS virtual servers
  become: true
  become_user: "{{ podman_user }}"
  become_method: containers.podman.podman_unshare
  ansible.builtin.file:
    path: "{{ freeradius_config_volume_mountpoint }}/sites-enabled/{{ item }}"
    state: absent
  loop: "{{ freeradius_disabled_sites }}"
  register: freeradius_sites_disabled

- name: Allow RADIUS from access point networks
  community.general.ufw:
    rule: allow
    from_ip: "{{ item.0 }}"
    to_port: "{{ item.1 }}"
    proto: udp
  loop: "{{ freeradius_client_networks | product(['1812', '1813']) | list }}"

# A configuration error would otherwise only surface as a failed restart.
- name: Check FreeRADIUS configuration
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.command:
    argv:
      - podman
      - run
      - --rm
      - --add-host
      - "ldap.{{ domain_fqdn }}:host-gateway"
      - --volume
      - "{{ freeradius_config_volume }}:{{ freeradius_config_directory }}"
      - --volume
      - "{{ freeradius_trust_volume }}:{{ freeradius_trust_directory }}"
      - "{{ freeradius_image }}"
      - freeradius
      - -C
  changed_when: false

- name: Create FreeRADIUS Quadlet
  become: true
  become_user: "{{ podman_user }}"
  containers.podman.podman_container:
    name: "{{ freeradius_container_name }}"
    image: "{{ freeradius_image }}"
    state: quadlet
    quadlet_filename: "{{ freeradius_quadlet_filename }}"
    quadlet_file_mode: "0640"
    add_hosts: "{{ dict([('ldap.' ~ domain_fqdn, 'host-gateway')]) }}"
    publish: "{{ freeradius_ports }}"
    volumes:
      - "{{ freeradius_config_volume }}:{{ freeradius_config_directory }}"
      - "{{ freeradius_trust_volume }}:{{ freeradius_trust_directory }}"
    quadlet_options:
      - "AutoUpdate=registry"
      - |
        [Install]
        WantedBy=default.target
  register: freeradius_quadlet

- name: Reload app-runner user systemd manager
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    daemon_reload: true
    scope: user
  when: freeradius_quadlet.changed

- name: Enable and start FreeRADIUS container
  become: true
  become_user: "{{ podman_user }}"
  ansible.builtin.systemd_service:
    name: "{{ freeradius_container_name }}.service"
    enabled: true
    state: "{{ 'restarted' if (
      freeradius_trust_certificate.changed
      or freeradius_client_ca.changed
      or freeradius_clients_file.changed
      or freeradius_sites.changed
      or freeradius_sites_enabled.changed
      or freeradius_sites_disabled.changed
      or freeradius_ldap_config.changed
      or freeradius_ldap_module.changed
      or freeradius_eap_config.changed
      or freeradius_quadlet.changed
    ) else 'started' }}"
    scope: user