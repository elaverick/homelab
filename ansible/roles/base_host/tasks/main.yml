---
- name: Verify supported operating system
  ansible.builtin.assert:
    that:
      - ansible_facts.distribution == "Debian"
      - ansible_facts.distribution_major_version == "13"
    fail_msg: >-
      This role supports Debian 13 only.
      Detected {{ ansible_facts.distribution }}
      {{ ansible_facts.distribution_version }}.

- name: Create APT keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Smallstep repository signing key
  ansible.builtin.get_url:
    url: https://packages.smallstep.com/keys/apt/repo-signing-key.gpg
    dest: /etc/apt/keyrings/smallstep.asc
    owner: root
    group: root
    mode: "0644"

- name: Configure Smallstep APT repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/smallstep.sources
    owner: root
    group: root
    mode: "0644"
    content: |
      Types: deb
      URIs: https://packages.smallstep.com/stable/debian
      Suites: debs
      Components: main
      Signed-By: /etc/apt/keyrings/smallstep.asc

- name: Update APT cache after adding Smallstep repository
  ansible.builtin.apt:
    update_cache: true

- name: Install required host packages
  ansible.builtin.apt:
    name: "{{ base_host_packages }}"
    state: present
    update_cache: true

- name: Ensure app-runner user exists
  ansible.builtin.user:
    name: "{{ podman_user }}"
    shell: /bin/bash
    create_home: true
    state: present
    password_lock: true

- name: Configure app-runner subordinate UID range
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ podman_user }}:"
    line: "{{ podman_user }}:{{ podman_subuid_start }}:{{ podman_subuid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Configure app-runner subordinate GID range
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ podman_user }}:"
    line: "{{ podman_user }}:{{ podman_subgid_start }}:{{ podman_subgid_count }}"
    create: true
    owner: root
    group: root
    mode: "0644"

- name: Enable systemd linger for app-runner
  ansible.builtin.command:
    cmd: "loginctl enable-linger {{ podman_user }}"
  changed_when: false

- name: Create network-online target drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/network-online.target.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install Homelab network readiness service
  ansible.builtin.template:
    src: homelab-network-online.service.j2
    dest: /etc/systemd/system/homelab-network-online.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Configure network-online target dependency
  ansible.builtin.template:
    src: network-online.target.d/homelab.conf
    dest: /etc/systemd/system/network-online.target.d/homelab.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

# The enrolment address is claimed statically, so check first that it
# belongs on this host's network and that no other device answers for it:
# a DHCP lease on another device, or another server that already holds it.
# See "The enrolment address" in docs/network.md.
- name: Check whether this host already has the enrolment address
  ansible.builtin.command:
    argv: [ip, -4, -o, address, show, to, "{{ enrolment_ipv4_address }}/32"]
  register: base_host_enrolment_address_local
  changed_when: false

- name: Check the enrolment address is on this host's network
  ansible.builtin.command:
    argv: [ip, -4, route, get, "{{ enrolment_ipv4_address }}"]
  register: base_host_enrolment_address_route
  changed_when: false
  failed_when: >-
    ' via ' in base_host_enrolment_address_route.stdout
    or ('dev ' ~ ansible_default_ipv4.interface ~ ' ') not in base_host_enrolment_address_route.stdout
  when: base_host_enrolment_address_local.stdout | length == 0

- name: Check no other device uses the enrolment address
  ansible.builtin.command:
    argv:
      - arping
      - -D
      - -q
      - -c
      - "3"
      - -w
      - "4"
      - -I
      - "{{ ansible_default_ipv4.interface }}"
      - "{{ enrolment_ipv4_address }}"
  register: base_host_enrolment_address_dad
  changed_when: false
  failed_when: false
  when: base_host_enrolment_address_local.stdout | length == 0

- name: Stop if another device uses the enrolment address
  ansible.builtin.fail:
    msg: >-
      Another device answers for {{ enrolment_ipv4_address }}. Reserve it
      on the DHCP server for an unused MAC address, or choose another
      enrolment_ipv4_address (see docs/network.md).
  when:
    - base_host_enrolment_address_dad is not skipped
    - base_host_enrolment_address_dad.rc != 0

- name: Install Homelab enrolment address service
  ansible.builtin.template:
    src: homelab-enrolment-address.service.j2
    dest: /etc/systemd/system/homelab-enrolment-address.service
    owner: root
    group: root
    mode: "0644"
  register: base_host_enrolment_address_service

- name: Enable and start Homelab enrolment address
  ansible.builtin.systemd_service:
    name: homelab-enrolment-address.service
    enabled: true
    daemon_reload: "{{ base_host_enrolment_address_service.changed }}"
    state: "{{ 'restarted' if base_host_enrolment_address_service.changed else 'started' }}"

- name: Configure kernel hardening
  ansible.builtin.template:
    src: 99-server-hardening.conf.j2
    dest: /etc/sysctl.d/99-server-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Apply sysctl configuration

- name: Configure SSH hardening
  ansible.builtin.template:
    src: ssh-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/homelab-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart SSH

- name: Configure unattended-upgrades schedule
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure unattended-upgrades policy
  ansible.builtin.template:
    src: 50unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Configure fail2ban SSH jail
  ansible.builtin.template:
    src: fail2ban-sshd.conf.j2
    dest: /etc/fail2ban/jail.d/homelab-sshd.conf
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Set UFW default incoming policy
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set UFW default outgoing policy
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Allow SSH from trusted IPv4 network
  community.general.ufw:
    rule: allow
    from_ip: "{{ homelab_ipv4_network }}"
    to_port: "{{ ssh_port }}"
    proto: tcp

- name: Allow SSH from trusted IPv6 network
  community.general.ufw:
    rule: allow
    from_ip: "{{ homelab_ipv6_network }}"
    to_port: "{{ ssh_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

- name: Install Homelab Root CA
  ansible.builtin.copy:
    src: "{{ source_certs_path }}/{{ root_certificate }}"
    dest: "/usr/local/share/ca-certificates/{{ root_certificate }}"
    owner: root
    group: root
    mode: "0644"
  notify: Update CA certificates